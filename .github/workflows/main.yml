name: Build Engine

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # <--- THIS IS THE CRITICAL FIX

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Engine
        # Build from the workspace root, targeting the rac-rs package
        run: cargo build --release -p rac-rs

      - name: Prepare Artifact
        shell: pwsh
        run: |
          # Create a folder for the zip contents
          New-Item -ItemType Directory -Force -Path release_folder
          
          # Copy the compiled exe (note: it builds to the root /target folder because it's a workspace)
          Copy-Item "target\release\rac-rs.exe" -Destination "release_folder\"
          
          # The engine usually needs these files to run. If your fork has them, uncomment these lines:
          # Copy-Item "rac-rs\assets" -Destination "release_folder\" -Recurse
          # Copy-Item "setup.ps1" -Destination "release_folder\" -ErrorAction SilentlyContinue
          
          # Zip the folder
          Compress-Archive -Path release_folder\* -DestinationPath rac-rs-custom.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rac-rs-custom-build
          path: rac-rs-custom.zip
